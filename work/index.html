<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FBF8F2">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Work ledger for the Sichos Kodesh retype.">
  <title>Work · שיחות קודש</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&amp;family=Source+Sans+3:wght@400;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body class="work">
  <header class="bar">
    <div class="bar-brand">
      <a href="/" lang="he">שיחות קודש</a>
    </div>
    <div class="bar-note">
      <button type="button" class="bar-ctl" id="download-ratings">Download ratings</button>
    </div>
  </header>

  <main class="ledger">
    <h1>Work</h1>
    <p class="ledger-counts" id="counts"></p>
    <p class="ledger-legend" id="legend">
      <span class="pg grade-none">none</span>
      ·
      <span class="pg grade-bad">bad</span>
      ·
      <span class="pg grade-rough">rough</span>
      ·
      <span class="pg grade-ok">ok</span>
      ·
      <span class="pg grade-good">good</span>
      ·
      <span class="pg grade-verified">verified</span>
    </p>
    <p class="ledger-models" id="models"></p>
    <div id="board"></div>
  </main>

  <div class="sheet" id="rate-sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="rate-heading">
      <p class="sheet-kicker" id="rate-kicker"></p>
      <h2 id="rate-heading" class="sheet-heading">Rate</h2>
      <p class="sheet-model" id="rate-model"></p>

      <p class="sheet-label" id="rate-grade-label">Grade</p>
      <div class="sheet-choices sheet-grades" id="rate-grades" role="radiogroup" aria-labelledby="rate-grade-label"></div>

      <label class="sheet-label" for="rate-note">Note</label>
      <textarea id="rate-note" rows="3"></textarea>

      <label class="sheet-check">
        <input id="rate-retype" type="checkbox">
        Retype later
      </label>
      <p class="sheet-hint">Queues the page only. Does not start a retype.</p>

      <div class="sheet-actions">
        <button type="button" id="rate-save">Save</button>
        <button type="button" id="rate-read">Read</button>
        <button type="button" id="rate-close">Close</button>
      </div>
    </div>
  </div>

  <script src="/js/work.js" defer></script>
</body>
</html>
