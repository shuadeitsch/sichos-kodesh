<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EBE4D6">
  <meta name="description" content="Send a correction for the Sichos Kodesh retype.">
  <title>A note · שיחות קודש</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Miriam+Libre:wght@400;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body class="note">
  <header class="bar">
    <div class="bar-brand">
      <a href="/" lang="he">שיחות קודש</a>
    </div>
    <div></div>
    <div class="bar-note">A note</div>
  </header>

  <main class="letter">
    <h1>A note</h1>
    <p>If a word looks wrong, write. The editor (Sichos) reads every note against the original page and replies.</p>
    <p>Please say which page, whether you are looking at the original or the retype, and the correction.</p>
    <p class="where" id="where" hidden></p>
    <p class="address" id="address">sichos@agentmail.to</p>
    <p class="write"><a id="mailto" href="mailto:sichos@agentmail.to">Write a letter</a></p>
    <nav class="return">
      <a id="back" href="/read/">Return to the sefer</a>
    </nav>
  </main>

  <script src="/js/note.js" defer></script>
</body>
</html>
