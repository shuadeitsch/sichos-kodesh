<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EBE4D6">
  <meta name="description" content="Read Sichos Kodesh volume 1 — original print or retype.">
  <title>שיחות קודש · reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Miriam+Libre:wght@400;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body class="reader">
  <header class="chrome">
    <div class="bar">
      <div class="bar-brand">
        <a href="/" lang="he">שיחות קודש</a>
        <button type="button" class="bar-ctl" id="open-contents" lang="he" aria-expanded="false" aria-controls="contents">מפתח</button>
      </div>
      <div class="bar-view" role="group" aria-label="View">
        <button type="button" class="view-btn" id="view-original" aria-pressed="false">Original</button>
        <button type="button" class="view-btn" id="view-retype" aria-pressed="true">Retype</button>
      </div>
      <div class="bar-page">
        <button type="button" class="step" id="prev" aria-label="Previous page">‹</button>
        <input id="page-input" type="number" min="1" inputmode="numeric" aria-label="Page">
        <span class="bar-print" id="bar-print" lang="he"></span>
        <button type="button" class="step" id="next" aria-label="Next page">›</button>
        <button type="button" class="bar-ctl bar-note-ctl" id="open-note">A note</button>
      </div>
    </div>
    <button type="button" class="farbrengen-line" id="farbrengen-line" lang="he" aria-controls="contents"></button>
  </header>

  <main id="stage" class="stage" lang="he">
    <noscript><p class="noscript">This reader needs JavaScript to turn the pages.</p></noscript>
  </main>

  <footer class="colophon">
    <span lang="he">הנחה בלתי מוגה</span>
  </footer>

  <div class="contents" id="contents" hidden>
    <div class="contents-panel" role="dialog" aria-modal="true" aria-labelledby="contents-title">
      <div class="contents-head">
        <h2 id="contents-title" lang="he">מפתח</h2>
        <button type="button" class="contents-close" id="close-contents">Close</button>
      </div>
      <div id="contents-list"></div>
    </div>
  </div>

  <div class="sheet" id="note-sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-heading">
      <p class="sheet-kicker" id="sheet-kicker"></p>
      <h2 id="sheet-heading" class="sheet-heading">A note</h2>
      <p class="sheet-quote" id="sheet-quote" lang="he" dir="rtl" hidden></p>
      <div class="sheet-ink" id="sheet-ink" hidden>
        <canvas id="sheet-canvas" hidden></canvas>
        <img id="sheet-scan" alt="Original ink" hidden>
      </div>
      <label class="sheet-label" for="sheet-text">The note</label>
      <textarea id="sheet-text" rows="6"></textarea>
      <div class="sheet-actions">
        <button type="button" id="sheet-send">Send</button>
        <button type="button" id="sheet-close">Close</button>
      </div>
    </div>
  </div>

  <script src="/js/reader.js" defer></script>
</body>
</html>
