<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FBF8F2">
  <meta name="description" content="Read Sichos Kodesh volume 1 — original print or retype.">
  <title>שיחות קודש · reader</title>
  <link rel="preload" href="/fonts/MiriamLibre-Static-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&amp;family=Source+Sans+3:wght@400;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body class="reader">
  <header class="chrome">
    <div class="bar">
      <div class="bar-brand">
        <a href="/" lang="he">שיחות קודש</a>
        <button type="button" class="bar-ctl" id="open-contents" lang="he" aria-expanded="false" aria-controls="contents">מפתח</button>
      </div>
      <div class="bar-view" role="group" aria-label="View">
        <button type="button" class="view-btn" id="view-original" aria-pressed="false">Original</button>
        <button type="button" class="view-btn" id="view-retype" aria-pressed="true">Retype</button>
        <button type="button" class="view-btn" id="view-both" aria-pressed="false">Both</button>
      </div>
      <div class="bar-page">
        <button type="button" class="step" id="prev" aria-label="Previous page">‹</button>
        <input id="page-input" type="number" min="1" inputmode="numeric" aria-label="Page">
        <span class="bar-print" id="bar-print" lang="he"></span>
        <button type="button" class="step" id="next" aria-label="Next page">›</button>
        <button type="button" class="bar-ctl bar-note-ctl" id="open-download">Download</button>
        <button type="button" class="bar-ctl bar-note-ctl" id="open-note">Note</button>
        <button type="button" class="bar-ctl bar-note-ctl" id="open-retype" aria-label="Machine this page">Machine</button>
      </div>
    </div>
    <div class="farbrengen-line is-empty" id="farbrengen-line">
      <button type="button" class="farbrengen-title" id="farbrengen-title" lang="he" aria-controls="contents">&nbsp;</button>
      <button type="button" class="farbrengen-retype" id="retype-group" hidden aria-label="Machine this farbrengen">Machine</button>
    </div>
    <p class="work-cue" id="work-cue" hidden></p>
  </header>

  <main id="stage" class="stage" lang="he">
    <div class="stage-frame" id="stage-frame">
      <div class="scan-stage" id="scan-stage">
        <img id="stage-scan" width="1366" height="1760" alt="" decoding="async">
      </div>
      <div class="both" id="both-view">
        <button type="button" class="both-ink" id="both-ink" aria-expanded="false" aria-controls="both-peek" aria-label="Original ink for the paragraph in view. Tap to enlarge.">
          <canvas class="both-ink-canvas" id="both-canvas" width="1366" height="1760" aria-hidden="true"></canvas>
        </button>
        <div class="both-leaf" id="both-leaf">
          <article class="leaf leaf--body is-skeleton" id="leaf" lang="he" dir="rtl" aria-hidden="true">
            <span class="leaf-print" id="leaf-print"></span>
            <span class="leaf-draft" id="leaf-draft" lang="en" hidden>draft</span>
            <div class="leaf-stamp" id="leaf-stamp">הנחה בלתי מוגה</div>
            <div class="leaf-body" id="leaf-body">
              <p class="skel-line"></p>
              <p class="skel-line"></p>
              <p class="skel-line"></p>
              <p class="skel-line"></p>
              <p class="skel-line"></p>
              <p class="skel-line"></p>
              <p class="skel-line"></p>
              <p class="skel-line"></p>
            </div>
          </article>
          <p class="quiet" id="leaf-quiet" lang="en" hidden>No retype for this page.</p>
        </div>
      </div>
    </div>
    <noscript><p class="noscript">This reader needs JavaScript to turn the pages.</p></noscript>
  </main>

  <footer class="page-end">
    <nav class="pager" aria-label="Pages">
      <div class="pager-turns">
        <button type="button" class="pager-turn" id="prev-bottom">Previous</button>
        <button type="button" class="pager-turn" id="next-bottom">Next</button>
      </div>
      <div class="pager-folio">
        <div class="pager-nums" id="pager-nums"></div>
        <div class="pager-jump">
          <span class="pager-jump-lbl">page</span>
          <input id="page-input-bottom" type="number" min="1" inputmode="numeric" aria-label="Go to page">
          <span class="pager-print" id="pager-print" lang="he"></span>
        </div>
      </div>
    </nav>
    <p class="colophon-line" lang="he">הנחה בלתי מוגה</p>
  </footer>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var v = q.get("view");
      if (v === "original") document.body.classList.add("is-original");
      if (v === "both") document.body.classList.add("is-both");
      var p = q.get("p");
      if (!p) return;
      var a = document.getElementById("page-input");
      var b = document.getElementById("page-input-bottom");
      if (a) a.value = p;
      if (b) b.value = p;
      var box = document.getElementById("pager-nums");
      if (!box || box.childElementCount) return;
      var n = parseInt(p, 10);
      if (!n) return;
      var i;
      for (i = n - 2; i <= n + 2; i++) {
        if (i < 1) continue;
        var el = document.createElement(i === n ? "span" : "button");
        if (i !== n) el.type = "button";
        el.className = i === n ? "pager-num is-current" : "pager-num";
        el.setAttribute("data-n", String(i));
        el.textContent = String(i);
        box.appendChild(el);
      }
    })();
  </script>

  <div class="contents" id="contents" hidden inert>
    <div class="contents-panel" role="dialog" aria-modal="true" aria-labelledby="contents-title">
      <div class="contents-head">
        <h2 id="contents-title" lang="he">מפתח</h2>
        <button type="button" class="contents-close" id="close-contents">Close</button>
      </div>
      <div id="contents-list"></div>
    </div>
  </div>

  <div class="both-peek" id="both-peek" hidden inert>
    <button type="button" class="both-peek-close" id="both-peek-close">Close</button>
    <img id="both-peek-scan" width="1366" height="1760" alt="Original ink" draggable="false">
  </div>

  <div class="sheet" id="note-sheet" hidden inert>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-heading">
      <p class="sheet-kicker" id="sheet-kicker"></p>
      <h2 id="sheet-heading" class="sheet-heading">Note</h2>
      <p class="sheet-quote" id="sheet-quote" lang="he" dir="rtl" hidden></p>
      <div class="sheet-ink" id="sheet-ink" hidden>
        <canvas id="sheet-canvas" hidden></canvas>
        <img id="sheet-scan" width="1366" height="1760" alt="Original ink" hidden>
      </div>
      <label class="sheet-label" for="sheet-text">The note</label>
      <textarea id="sheet-text" rows="6"></textarea>
      <div class="sheet-actions">
        <button type="button" id="sheet-send">Send</button>
        <button type="button" id="sheet-close">Close</button>
      </div>
    </div>
  </div>

  <div class="sheet" id="download-sheet" hidden inert>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="download-heading">
      <p class="sheet-kicker" id="download-kicker"></p>
      <h2 id="download-heading" class="sheet-heading">Download</h2>

      <p class="sheet-label" id="download-kind-label">Kind</p>
      <div class="sheet-choices" role="radiogroup" aria-labelledby="download-kind-label">
        <button type="button" class="sheet-choice" id="download-kind-original" data-kind="original" aria-pressed="false">Original</button>
        <button type="button" class="sheet-choice" id="download-kind-retype" data-kind="retype" aria-pressed="false">Retype</button>
        <button type="button" class="sheet-choice" id="download-kind-side" data-kind="side-by-side" aria-pressed="false">Side by side</button>
      </div>

      <p class="sheet-label">Which pages</p>
      <div class="sheet-mode is-on" id="download-mode-group-wrap">
        <button type="button" class="sheet-mode-btn" id="download-mode-group" aria-pressed="true">This farbrengen / this section</button>
        <select class="sheet-select" id="download-group" lang="he" dir="rtl" aria-label="Farbrengen or section"></select>
      </div>
      <div class="sheet-mode" id="download-mode-pages-wrap">
        <button type="button" class="sheet-mode-btn" id="download-mode-pages" aria-pressed="false">Pages</button>
        <div class="sheet-range">
          <label for="download-from">from <input id="download-from" type="number" min="1" inputmode="numeric"></label>
          <label for="download-to">to <input id="download-to" type="number" min="1" inputmode="numeric"></label>
        </div>
      </div>

      <p class="sheet-status" id="download-status" hidden></p>
      <p class="sheet-error" id="download-error" hidden></p>

      <div class="sheet-actions">
        <button type="button" id="download-go">Download</button>
        <button type="button" id="download-close">Close</button>
      </div>
    </div>
  </div>

  <script src="/js/machine.js" defer></script>
  <script src="/js/reader.js" defer></script>
  <script src="/js/pdf.js" defer></script>
</body>
</html>
